services:
  postgres:
    image: postgres:18
    container_name: linkora-test-postgres
    environment:
      POSTGRES_DB: linkora_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - linkora_test_postgres:/var/lib/postgresql
      - ./backend/test/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7
    container_name: linkora-test-redis
    ports:
      - "6380:6379"

volumes:
  linkora_test_postgres: